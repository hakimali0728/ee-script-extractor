<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EE Script Extractor — Get Google Earth Engine (GEE) App Source Code</title>
  <meta name="description" content="Free tool to extract the published JavaScript source code from any public Google Earth Engine (GEE) app. Paste the app URL and get the script instantly — web app + Python/Node CLI, no login." />
  <meta name="keywords" content="google earth engine, earth engine, gee, extract earth engine code, earth engine app source code, gee script extractor, get javascript from earth engine app, earthengine apps, remote sensing, geospatial" />
  <meta name="author" content="hakimali0728" />
  <link rel="canonical" href="https://hakimali0728.github.io/ee-script-extractor/" />

  <!-- Open Graph / social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="EE Script Extractor — Get Google Earth Engine (GEE) App Source Code" />
  <meta property="og:description" content="Paste a public Google Earth Engine app URL and get its published JavaScript source code instantly. Free web tool + CLI." />
  <meta property="og:url" content="https://hakimali0728.github.io/ee-script-extractor/" />
  <meta property="og:image" content="https://hakimali0728.github.io/ee-script-extractor/favicon.svg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="EE Script Extractor — Get Google Earth Engine (GEE) App Source Code" />
  <meta name="twitter:description" content="Extract the JavaScript source code from any public Google Earth Engine app. Paste a URL, get the script." />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css?v=3" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "EE Script Extractor",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Any (web browser)",
    "url": "https://hakimali0728.github.io/ee-script-extractor/",
    "description": "Extract the published JavaScript source code from any public Google Earth Engine (GEE) app. Paste the app URL and get the script.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="logo">🌍</span>
      <div>
        <h1>EE Script Extractor</h1>
        <p class="tagline">Extract the published JavaScript source from a public Google Earth Engine app.</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <label for="url" class="field-label">Earth Engine app URL</label>
      <div class="input-row">
        <input
          id="url"
          type="url"
          placeholder="https://google.earthengine.app/view/your-app"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="extract" class="btn primary">Extract</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="result" class="panel result hidden">
      <div class="result-toolbar">
        <span id="meta" class="meta"></span>
        <div class="actions">
          <button id="copy" class="btn">📋 Copy script</button>
          <button id="download" class="btn">⬇️ Download .js</button>
        </div>
      </div>
      <pre class="code-box"><code id="output"></code></pre>
    </section>
  </main>

  <footer class="site-footer">
    <p>Run with <code>python server.py</code> for proxy-free extraction · or host static with a Cloudflare Worker</p>
  </footer>

  <script src="app.js?v=4"></script>
</body>
</html>
